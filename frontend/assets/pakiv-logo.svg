<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="pakivTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35677C" />
      <stop offset="100%" stop-color="#174E63" />
    </linearGradient>
    <linearGradient id="pakivAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E8C9E" />
      <stop offset="100%" stop-color="#2D5A6E" />
    </linearGradient>
    <filter id="pakivShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#174E63" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Emblem Icon: Stylized Shield / P monogram -->
  <g transform="translate(10, 10)">
    <!-- Base Shield Frame -->
    <path d="M40 0 C62 0, 80 18, 80 40 C80 62, 60 76, 40 80 C20 76, 0 62, 0 40 C0 18, 18 0, 40 0 Z" 
          fill="url(#pakivTealGrad)" filter="url(#pakivShadow)"/>
    
    <!-- Inner Geometric Prism P -->
    <path d="M26 22 H46 C54 22, 60 27, 60 34 C60 41, 54 46, 46 46 H36 V58 H26 V22 Z M36 31 V37 H45 C47.5 37, 50 36, 50 34 C50 32, 47.5 31, 45 31 H36 Z" 
          fill="#FFFFFF" />
    
    <!-- Verification Checkmark Accent -->
    <circle cx="56" cy="56" r="14" fill="#18794E" stroke="#FFFFFF" stroke-width="2.5" />
    <path d="M51 56 L55 60 L62 52" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Wordmark -->
  <g transform="translate(105, 52)">
    <text x="0" y="0" font-family="'Poppins', sans-serif" font-size="38" font-weight="800" letter-spacing="3" fill="#174E63">
      PAKIV
    </text>
  </g>

  <!-- Tagline / Descriptor -->
  <g transform="translate(107, 72)">
    <text x="0" y="0" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="600" letter-spacing="2.8" fill="#687887">
      EMPLOYEE VERIFICATION
    </text>
  </g>
</svg>

