<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In — Pakiv Verification Portal</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/assets/pakiv-logo.svg">

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="login-page-wrap">

  <div class="login-card">
    <div class="login-logo">
      <a href="/" title="Back to Public Portal">
        <img src="/assets/pakiv-logo.svg" alt="Pakiv">
      </a>
    </div>

    <h1 class="login-title">Admin Console</h1>
    <p class="login-subtitle">Sign in to manage employee verification records</p>

    <!-- Error Alert Box -->
    <div id="login-error-msg" style="display: none; background-color: var(--color-danger-bg); color: var(--color-danger); border: 1px solid var(--color-danger-border); padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.8125rem; font-weight: 500; margin-bottom: 1.25rem;"></div>

    <form id="admin-login-form" autocomplete="on">
      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="login-email" class="form-label">
          <span>Administrator Email</span>
          <span class="required">*</span>
        </label>
        <input
          type="email"
          id="login-email"
          class="form-input"
          placeholder="admin@pakiv.com"
          required
          autocomplete="username"
        >
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="login-password" class="form-label">
          <span>Password</span>
          <span class="required">*</span>
        </label>
        <input
          type="password"
          id="login-password"
          class="form-input"
          placeholder="••••••••••••"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" id="btn-login-submit" class="btn-login-submit">
        Sign In to Admin Portal
      </button>

      <div style="margin-top: 1.75rem; text-align: center; font-size: 0.8125rem; color: var(--color-text-muted);">
        <a href="/" style="display: inline-flex; align-items: center; gap: 0.35rem; color: var(--color-text-secondary);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back to Public Verification Portal
        </a>
      </div>
    </form>
  </div>

  <div style="margin-top: 1.5rem; font-size: 0.75rem; color: rgba(255, 255, 255, 0.7); text-align: center;">
    Pakiv Corporate Security • Baramulla, Jammu & Kashmir
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
